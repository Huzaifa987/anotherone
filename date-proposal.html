<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Love You 💕</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fbc2eb, #a18cd1);
    background-size: 400% 400%;
    animation: bgMove 8s ease infinite;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    overflow-x: hidden;
  }

  @keyframes bgMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .card {
    background: rgba(255,255,255,0.92);
    border-radius: 24px;
    padding: 40px 30px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    max-width: 480px;
    width: 90%;
    position: relative;
    z-index: 2;
  }

  h1 {
    font-size: 2rem;
    color: #d63384;
    margin-bottom: 10px;
    animation: pulse 1.4s infinite;
  }

  @keyframes pulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }

  h2 {
    font-size: 1.3rem;
    color: #6f42c1;
    margin-bottom: 30px;
  }

  .btn-row {
    display: flex;
    justify-content: center;
    gap: 30px;
    position: relative;
    min-height: 70px;
  }

  button {
    padding: 14px 34px;
    font-size: 1.1rem;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    font-weight: bold;
    transition: transform 0.15s ease, background 0.3s;
  }

  #yesBtn {
    background: linear-gradient(135deg, #ff6b9d, #c94b93);
    color: white;
    box-shadow: 0 8px 20px rgba(214, 51, 132, 0.4);
  }

  #yesBtn:hover {
    transform: scale(1.12);
  }

  #noBtn {
    background: #e0e0e0;
    color: #555;
    position: relative;
  }

  #noBtn.escaping {
    position: fixed;
  }

  .hidden { display: none !important; }

  #dateSection {
    margin-top: 20px;
  }

  #dateSection h3 {
    color: #d63384;
    margin-bottom: 15px;
    animation: shake 0.5s infinite;
  }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-4px) rotate(-1deg); }
    40% { transform: translateX(4px) rotate(1deg); }
    60% { transform: translateX(-3px); }
    80% { transform: translateX(3px); }
  }

  .hurry-text {
    color: #e63946;
    font-size: 0.9rem;
    margin-bottom: 15px;
    font-weight: bold;
    animation: blinkFast 0.8s infinite;
  }

  @keyframes blinkFast {
    0%,100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .calendar {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 8px;
    margin-top: 10px;
  }

  .day-label {
    font-size: 0.7rem;
    color: #999;
    font-weight: bold;
  }

  .date-btn {
    background: #fff0f5;
    border: 2px solid #ffb3c6;
    border-radius: 10px;
    padding: 8px 0;
    font-size: 0.9rem;
    color: #d63384;
    cursor: pointer;
    transition: all 0.2s;
    animation: wiggle 1.6s infinite;
    animation-delay: calc(var(--i) * 0.05s);
  }

  @keyframes wiggle {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(-3deg); }
    75% { transform: rotate(3deg); }
  }

  .date-btn:hover {
    background: #ff6b9d;
    color: white;
    transform: scale(1.15);
  }

  #promiseSection {
    margin-top: 10px;
  }

  #promiseSection h3 {
    color: #d63384;
    font-size: 1.4rem;
    animation: pop 0.5s ease;
  }

  #promiseSection p {
    margin-top: 10px;
    color: #555;
    font-size: 1rem;
  }

  @keyframes pop {
    0% { transform: scale(0); opacity: 0; }
    70% { transform: scale(1.15); }
    100% { transform: scale(1); opacity: 1; }
  }

  .heart {
    position: fixed;
    font-size: 20px;
    animation: floatUp linear forwards;
    pointer-events: none;
    z-index: 1;
  }

  @keyframes floatUp {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
  }
</style>
</head>
<body>

<div class="card">
  <div id="askSection">
    <h1>I Love You ❤️</h1>
    <h2>When are we going on a date?</h2>
    <div class="btn-row">
      <button id="yesBtn">Yes</button>
      <button id="noBtn">No</button>
    </div>
  </div>

  <div id="dateSection" class="hidden">
    <h3>Pick our date 💗</h3>
    <p class="hurry-text">Jaldi karo... koi aur na le jaye ye date! ⏰</p>
    <div class="calendar" id="calendarGrid"></div>
  </div>

  <div id="promiseSection" class="hidden">
    <h3>Now that's a promise! 💍</h3>
    <p id="chosenDateText"></p>
    <p>Ab jana parega date pr, lazmi! 😘</p>
  </div>
</div>

<script>
  const noBtn = document.getElementById('noBtn');
  const yesBtn = document.getElementById('yesBtn');
  const askSection = document.getElementById('askSection');
  const dateSection = document.getElementById('dateSection');
  const promiseSection = document.getElementById('promiseSection');
  const calendarGrid = document.getElementById('calendarGrid');
  const chosenDateText = document.getElementById('chosenDateText');

  // Make the No button run away when the mouse gets close
  function moveNoButton() {
    const btnWidth = noBtn.offsetWidth;
    const btnHeight = noBtn.offsetHeight;
    const maxX = window.innerWidth - btnWidth - 20;
    const maxY = window.innerHeight - btnHeight - 20;

    const newX = Math.random() * maxX;
    const newY = Math.random() * maxY;

    noBtn.classList.add('escaping');
    noBtn.style.left = newX + 'px';
    noBtn.style.top = newY + 'px';
  }

  function distance(x1, y1, x2, y2) {
    return Math.sqrt((x2 - x1) ** 2 + (y2 - y1) ** 2);
  }

  document.addEventListener('mousemove', (e) => {
    const rect = noBtn.getBoundingClientRect();
    const btnCenterX = rect.left + rect.width / 2;
    const btnCenterY = rect.top + rect.height / 2;
    const dist = distance(e.clientX, e.clientY, btnCenterX, btnCenterY);

    if (dist < 100) {
      moveNoButton();
    }
  });

  // Also dodge on touch (mobile)
  noBtn.addEventListener('touchstart', (e) => {
    e.preventDefault();
    moveNoButton();
  });

  noBtn.addEventListener('click', (e) => {
    e.preventDefault();
    moveNoButton();
  });

  // Build August 2026 calendar
  function buildCalendar() {
    const dayLabels = ['S','M','T','W','T','F','S'];
    dayLabels.forEach(d => {
      const label = document.createElement('div');
      label.className = 'day-label';
      label.textContent = d;
      calendarGrid.appendChild(label);
    });

    // August 1, 2026 is a Saturday
    const firstDayOfWeek = 6; // 0=Sun ... 6=Sat
    for (let i = 0; i < firstDayOfWeek; i++) {
      const blank = document.createElement('div');
      calendarGrid.appendChild(blank);
    }

    for (let d = 1; d <= 31; d++) {
      const btn = document.createElement('button');
      btn.className = 'date-btn';
      btn.textContent = d;
      btn.style.setProperty('--i', d);
      btn.addEventListener('click', () => selectDate(d));
      calendarGrid.appendChild(btn);
    }
  }

  function selectDate(day) {
    chosenDateText.textContent = `Our date: August ${day}, 2026 💕`;
    dateSection.classList.add('hidden');
    promiseSection.classList.remove('hidden');
    launchHearts();
  }

  yesBtn.addEventListener('click', () => {
    askSection.classList.add('hidden');
    dateSection.classList.remove('hidden');
  });

  function launchHearts() {
    for (let i = 0; i < 30; i++) {
      setTimeout(() => {
        const heart = document.createElement('div');
        heart.className = 'heart';
        heart.textContent = '❤️';
        heart.style.left = Math.random() * window.innerWidth + 'px';
        heart.style.bottom = '0px';
        heart.style.animationDuration = (2 + Math.random() * 2) + 's';
        heart.style.fontSize = (16 + Math.random() * 20) + 'px';
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 4000);
      }, i * 80);
    }
  }

  buildCalendar();
</script>

</body>
</html>
